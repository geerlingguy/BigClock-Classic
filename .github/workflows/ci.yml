name: Build and Release

on:
  push:
    branches: [master]
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  pull_request:

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    container: ghcr.io/autc04/retro68
    strategy:
      matrix:
        include:
          - arch: ppc
            toolchain: /Retro68-build/toolchain/powerpc-apple-macos/cmake/retroppc.toolchain.cmake
          - arch: 68k
            toolchain: /Retro68-build/toolchain/m68k-apple-macos/cmake/retro68.toolchain.cmake
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_TOOLCHAIN_FILE=${{ matrix.toolchain }}
          make

      - name: Rename artifacts
        run: |
          mkdir dist
          cp build/BigClock.bin dist/BigClock-${{ matrix.arch }}.bin
          cp build/BigClock.dsk dist/BigClock-${{ matrix.arch }}.dsk

      - uses: actions/upload-artifact@v4
        with:
          name: BigClock-${{ matrix.arch }}
          path: dist/*

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
