name: Build and Release

on:
  push:
    branches: [master]
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  pull_request:

env:
  RETRO68: /Retro68-build/toolchain

jobs:
  build:
    name: Build 68k, PowerPC, and fat
    runs-on: ubuntu-latest
    container: ghcr.io/autc04/retro68
    steps:
      - uses: actions/checkout@v7

      - name: Build PowerPC
        run: |
          mkdir build-ppc && cd build-ppc
          cmake .. -DCMAKE_TOOLCHAIN_FILE=$RETRO68/powerpc-apple-macos/cmake/retroppc.toolchain.cmake
          make

      - name: Build 68k
        run: |
          mkdir build-68k && cd build-68k
          cmake .. -DCMAKE_TOOLCHAIN_FILE=$RETRO68/m68k-apple-macos/cmake/retro68.toolchain.cmake
          make

      - name: Build fat binary
        run: |
          mkdir build-fat
          $RETRO68/bin/Rez $RETRO68/m68k-apple-macos/RIncludes/RetroPPCAPPL.r \
            -I$RETRO68/m68k-apple-macos/RIncludes \
            -DCFRAG_NAME='"BigClock"' \
            --copy build-68k/BigClock.code.bin \
            --data build-ppc/BigClock.pef build-ppc/icon.rsrc.bin \
            -t APPL -c BgCk \
            -o build-fat/BigClock.bin --cc build-fat/BigClock.dsk

      - name: Collect artifacts
        run: |
          mkdir dist
          for arch in ppc 68k fat; do
            cp build-$arch/BigClock.bin dist/BigClock-$arch.bin
            cp build-$arch/BigClock.dsk dist/BigClock-$arch.dsk
          done
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: BigClock
          path: dist/*

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: BigClock
          path: dist

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
